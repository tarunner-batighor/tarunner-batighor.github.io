<script>  
    const portalContainer = document.getElementById('portalContainer');  
    const pinwheel = document.getElementById('pinwheel');  
    const hintText = document.getElementById('hintText');  
    const subTitle = document.getElementById('subTitle');  
    const contentContainer = document.getElementById('contentContainer');  
    const dynamicContent = document.getElementById('dynamicContent');  
    const backBtn = document.getElementById('backBtn');  

    let isMenuOpen = false;  

    /* HTML SECURITY - পোস্টের লেখা থেকে ক্ষতিকর কোড (XSS) আটকানো */
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text ?? '');
        return div.innerHTML;
    }

    pinwheel.addEventListener('click', function(e) {  
    if (e.target.closest('.circle-menu-item')) return;  

    isMenuOpen = !isMenuOpen;  
    if (isMenuOpen) {  
        portalContainer.classList.add('open');  
        pinwheel.classList.add('paused');  
        hintText.innerText = '✨ কী পড়বেন? সিদ্ধান্ত আপনার!';  
    } else {  
        portalContainer.classList.remove('open');  
        pinwheel.classList.remove('paused');  
        hintText.innerText = '|| প্রতিটি পাপড়ি, একেকটি ভাবনার দুয়ার ||';  
    }  
});
     const menuItems = document.querySelectorAll('.circle-menu-item');  
    menuItems.forEach(function(item) {  
        item.addEventListener('click', async function(e) {
            e.stopPropagation();  

            const category = this.getAttribute('data-cat');  
            portalContainer.style.display = 'none';  
            hintText.style.display = 'none';  
            subTitle.style.display = 'none';  
            contentContainer.style.display = 'block';  

let htmlData = `
    <h2 class="category-header-title">
        ${this.innerText}
    </h2>
    <p style="text-align:center;padding:20px;">
        পোস্ট লোড হচ্ছে...
    </p>
`;

dynamicContent.innerHTML = htmlData;

try {
const module =
        await import("./website-posts.js");

    const posts =
        await module.getPublishedPosts(category);

    htmlData = `
        <h2 class="category-header-title">
            ${this.innerText}
        </h2>
    `;

    if (posts.length === 0) {

        htmlData += `
            <div class="post-card">
                <h2 class="post-title">
                    লেখা শীঘ্রই প্রকাশিত হবে
                </h2>

                <div class="post-content">
                    এই বিভাগে এখনো কোনো Published পোস্ট নেই।
                </div>
            </div>
        `;

    } else {

        posts.forEach(function(post) {

            let date = "";

            if (
                post.createdAt &&
                post.createdAt.seconds
            ) {
                date = new Date(
                    post.createdAt.seconds * 1000
                ).toLocaleDateString("bn-BD");
            }

            htmlData += `
                <div class="post-card">

                    <h2 class="post-title">
                        ${escapeHtml(post.title || "")}
                    </h2>

                    <div class="post-content">
                        ${escapeHtml(post.content || "")}
                    </div>

                    <div class="post-footer">

                        <div class="post-tags">
                            ${escapeHtml(post.category || "সাধারণ")}
                        </div>

                        <div class="post-date">
                            ${date}
                        </div>

                    </div>

                </div>
            `;

        });

    }

    dynamicContent.innerHTML =
        htmlData;

} catch (error) {

    console.error(
        "Post loading error:",
        error
    );

    dynamicContent.innerHTML = `
        <div class="post-card">
            <h2 class="post-title">
                ❌ পোস্ট লোড করা যায়নি
            </h2>

            <div class="post-content">
                ${error.message}
            </div>
        </div>
    `;

}
    });  
    });  

    backBtn.addEventListener('click', function() {  
        contentContainer.style.display = 'none';  
        portalContainer.style.display = 'flex';  
        hintText.style.display = 'block';  
        subTitle.style.display = 'block';  

        portalContainer.classList.remove('open');  
        pinwheel.classList.remove('paused');  
        isMenuOpen = false;  
        hintText.innerText = '|| প্রতিটি পাপড়ি, একেকটি ভাবনার দুয়ার ||';  
    });  
</script>

            overlay.querySelector("#editorTitle").value.trim();

            overlay.querySelector("#editorContent").value.trim();

            overlay.querySelector("#editorCategory").value;


          if (!title) {
            message.innerText = "⚠️ শিরোনাম লিখুন।";
            return;
          }

          if (!category) {
            message.innerText = "⚠️ একটি ক্যাটাগরি নির্বাচন করুন।";

            return;
          }


          overlay.remove();

          resolve({
            title,
            content,
            category
          });

        });


      /* বাতিল */

        .querySelector("#editorCancelBtn")
        .addEventListener("click", () => {

          resolve(null);

        });

     Delete মানে চিরতরে মুছে যাওয়া
  ========================= */

  async function loadPublishedPostsAdmin() {

    const container =
      document.getElementById(
        "publishedPosts"
      );

    container.innerHTML =
      "<p>Published পোস্ট খোঁজা হচ্ছে...</p>";

    try {

      const q =
        query(
          collection(db, "Posts"),
          where(
            "status",
            "==",
            "published"
          )
        );

      const snapshot =
        await getDocs(q);

      if (snapshot.empty) {

        container.innerHTML = `

          <div style="
            background:#1e293b;
            padding:20px;
            border-radius:12px;
            text-align:center;
          ">

            ✅ কোনো Published পোস্ট নেই।

        </p>

      /* নতুন পোস্ট আগে দেখানো */

      const docs = [];

      snapshot.forEach(
        (postDoc) => {
          docs.push(postDoc);
        }
      );

      docs.sort((a, b) => {
        const ca =
          (a.data().createdAt &&
            a.data().createdAt.seconds) ||
          0;

        const cb =
          (b.data().createdAt &&
            b.data().createdAt.seconds) ||
          0;

        return cb - ca;
      });


      docs.forEach(
        (postDoc) => {

          const post =
            postDoc.data();

          let date = "";

          if (
            post.createdAt &&
            post.createdAt.seconds

                    "Untitled"

                display:flex;
                gap:8px;
              ">

                <button
                  class="editBtn"
                  style="
                    background:#3b82f6;
                    color:white;
                    border:none;
                    padding:7px 12px;
                    border-radius:7px;
                    cursor:pointer;
                    font-size:13px;
                    font-weight:bold;
                  "
                >
                  ✏️ Edit
                </button>


                <button
                  class="publishedDeleteBtn"
                  style="
                    background:#ef4444;
                    color:white;
                    border:none;
                    padding:7px 12px;
                    border-radius:7px;
                    cursor:pointer;
                    font-size:13px;
                    font-weight:bold;
                  "
                >
                  🗑 Delete
                </button>

              </div>

            </div>


            <div
              class="contentPreview"
              style="
                display:none;
                margin-top:12px;
                padding:12px;
                background:#0f172a;
                border-radius:8px;
                color:#cbd5e1;
                font-size:14px;
                line-height:1.6;
                white-space:pre-line;
                max-height:250px;
                overflow-y:auto;
              "
            >
              ${escapeHtml(
                post.content || ""
              )}
            </div>
          `;


          /* =========================
             সারিতে ক্লিক = লেখা খোলা/বন্ধ
          ========================= */

          const header =
            row.querySelector(
              ".rowHeader"
            );

          const preview =
            row.querySelector(
              ".contentPreview"
            );

          header.addEventListener(
            "click",
            (e) => {

              if (
                e.target.closest("button")
              ) {
                return;
              }

              preview.style.display =
                preview.style.display === "none"
                  ? "block"
                  : "none";

            }
          );


          /* =========================
             EDIT (Published)
          ========================= */

          row
            .querySelector(

            )
            .addEventListener(

              async () => {

                  await openPostEditor({
                    title: post.title || "",

                    category: post.category || ""
                  });

                  await updateDoc(
                    doc(
                      db,
                      "Posts",
                      postDoc.id
                    ),
                    {
                      title: result.title,
                      content: result.content,
                      category: result.category
                    }
                  );

                  alert(
                    "✏️ পোস্ট আপডেট হয়েছে!"
                  );

                  loadPublishedPostsAdmin();

                } catch (error) {
                  console.error(error);
                  alert(
                    "❌ সেভ করা যায়নি:\n\n" +
                    error.message
                  );
                }

              }
            );


          /* =========================
             DELETE (Published)
             চিরতরে মুছে যায় —
             Pending-এ ফিরে আসে না
          ========================= */

          row
            .querySelector(

        <div style="
          background:#450a0a;
          padding:20px;
          border-radius:12px;
          color:#fecaca;
        ">

          ❌ Published পোস্ট লোড করা যায়নি।

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      `;

    }

  }


  /* =========================
     CATEGORY NAME
  ========================= */

  function getCategoryName(
    category
  ) {

    const names = {

      ayat:
        "আয়াত ও হাদিস",

      atheism:
        "নাস্তিকতার জবাব",

      protest:
        "প্রতিবাদ",

      biography:
        "জীবনী",

      story:
        "গল্প-উপন্যাস"

    };


    return escapeHtml(
      names[category] ||
      category ||
      "সাধারণ"
    );

  }


  /* =========================
     HTML SECURITY
  ========================= */

  function escapeHtml(text) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      String(text ?? "");

    return div.innerHTML;

  }
