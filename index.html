<div class="portal-container" id="portalContainer">

            </div>
            <div class="blade b-3">

            </div>
            <div class="blade b-5">

                    <span class="mi-text">গল্প-উপন্যাস</span>
                </div>
            </div>
        </div>

        <button class="beacon-core" type="button" aria-label="মেনু খুলুন বা বন্ধ করুন">
            <svg class="fp-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M12 6c-3.9 0-7 2.9-7 6.5 0 1.5.4 2.9 1.2 4.1"/>
                <path d="M12 6c3.9 0 7 2.9 7 6.5 0 2.1-.6 4-1.7 5.6"/>
