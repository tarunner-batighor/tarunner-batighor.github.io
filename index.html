<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="PVklQCflQ1leQWTMHnXAESU-vyPi4K3D8X8ytwZtm3M" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>তারুণ্যের বাতিঘর</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .site-title {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        .site-subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .portal-container {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .stick {
            position: absolute;
            width: 8px;
            height: 180px;
            background: linear-gradient(to bottom, #94a3b8, #334155);
            top: 170px;
            border-radius: 4px;
            z-index: 1;
        }

        .pinwheel {
            position: relative;
            width: 200px;
            height: 200px;
            z-index: 2;
            cursor: pointer;
            animation: rotatePinwheel 6s linear infinite;
            transition: transform 0.5s ease;
        }

        @keyframes rotatePinwheel {
            100% { transform: rotate(360deg); }
        }

        .pinwheel.paused {
            animation-play-state: paused;
            transform: scale(0.95);
        }

        .blade {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 0 100% 0 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 12px rgba(255,255,255,0.3);
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        .b-1 { background: #10b981; transform: rotate(0deg); }
        .b-2 { background: #ef4444; transform: rotate(72deg); }
        .b-3 { background: #3b82f6; transform: rotate(144deg); }
        .b-4 { background: #8b5cf6; transform: rotate(216deg); }
        .b-5 { background: #f59e0b; transform: rotate(288deg); }

        .center-pin {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ffffff;
            border: 4px solid #0f172a;
            border-radius: 50%;
            z-index: 20;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .hint-text {
            margin-top: 30px;
            color: #38bdf8;
            font-size: 0.95rem;
            text-align: center;
            font-weight: 500;
        }

        .circle-menu-item {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            cursor: pointer;
            z-index: 15;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border: 3px solid rgba(255,255,255,0.6);
            padding: 5px;
            top: 45px;
            left: 45px;
        }

        .portal-container.open .circle-menu-item { opacity: 1; }

        .b-1 .circle-menu-item { background: #10b981; transform: scale(0) rotate(0deg); }
        .b-2 .circle-menu-item { background: #ef4444; transform: scale(0) rotate(-72deg); }
        .b-3 .circle-menu-item { background: #3b82f6; transform: scale(0) rotate(-144deg); }
        .b-4 .circle-menu-item { background: #8b5cf6; transform: scale(0) rotate(-216deg); }
        .b-5 .circle-menu-item { background: #f59e0b; transform: scale(0) rotate(-288deg); }

        .portal-container.open .b-1 .circle-menu-item { transform: scale(1) rotate(0deg); }
        .portal-container.open .b-2 .circle-menu-item { transform: scale(1) rotate(-72deg); }
        .portal-container.open .b-3 .circle-menu-item { transform: scale(1) rotate(-144deg); }
        .portal-container.open .b-4 .circle-menu-item { transform: scale(1) rotate(-216deg); }
        .portal-container.open .b-5 .circle-menu-item { transform: scale(1) rotate(-288deg); }

        .content-container {
            display: none;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: #e0522d;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease;
        }

        .back-btn:hover { background: #c84320; }

        .category-header-title {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .post-card {
            background: #ffffff;
            border: 2px solid #e0522d;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .post-card .post-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .post-card .post-title {
            font-size: 1.5rem;
            color: #0f172a;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .post-card .post-content {
            color: #1e293b;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 18px;
            white-space: pre-line;
        }

        .post-card .post-footer {
            border-top: 1px solid #cbd5e1;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.85rem;
            color: #334155;
            font-weight: 600;
            line-height: 1.4;
        }

        .post-card .post-tags { max-width: 65%; }
        .post-card .post-date { text-align: right; white-space: nowrap; }

        @media (max-width: 400px) {
            .portal-container { transform: scale(0.85); }
            .site-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <h1 class="site-title">তারুণ্যের বাতিঘর</h1>
    <p class="site-subtitle" id="subTitle">“তারুণ্যের কলমে, সত্যের কথা”</p>

    <div class="portal-container" id="portalContainer">
        <div class="stick"></div>
        <div class="pinwheel" id="pinwheel">
            <div class="blade b-1"><div class="circle-menu-item" data-cat="ayat">আয়াত ও হাদিস</div></div>
            <div class="blade b-2"><div class="circle-menu-item" data-cat="atheism">নাস্তিকতার জবাব</div></div>
            <div class="blade b-3"><div class="circle-menu-item" data-cat="protest">প্রতিবাদ</div></div>
            <div class="blade b-4"><div class="circle-menu-item" data-cat="biography">জীবনী</div></div>
            <div class="blade b-5"><div class="circle-menu-item" data-cat="story">গল্প-উপন্যাস</div></div>
            <div class="center-pin"></div>
        </div>
    </div>

    <p class="hint-text" id="hintText">|| প্রতিটি পাপড়ি, একেকটি ভাবনার দুয়ার ||</p>

    <div class="content-container" id="contentContainer">
        <button class="back-btn" id="backBtn">⬅ হোম পেজে ফিরুন</button>
        <div id="dynamicContent"></div>
    </div>

    <script>
        const portalContainer = document.getElementById('portalContainer');
        const pinwheel = document.getElementById('pinwheel');
        const hintText = document.getElementById('hintText');
        const subTitle = document.getElementById('subTitle');
        const contentContainer = document.getElementById('contentContainer');
        const dynamicContent = document.getElementById('dynamicContent');
        const backBtn = document.getElementById('backBtn');

        let isMenuOpen = false;

        pinwheel.addEventListener('click', function(e) {
            if (e.target.classList.contains('circle-menu-item')) return;

            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                portalContainer.classList.add('open');
                pinwheel.classList.add('paused');
                hintText.innerText = '✨ কী পড়বেন? সিদ্ধান্ত আপনার!';
            } else {
                portalContainer.classList.remove('open');
                pinwheel.classList.remove('paused');
                hintText.innerText = '|| প্রতিটি পাপড়ি, একেকটি ভাবনার দুয়ার ||';
            }
        });

        const menuItems = document.querySelectorAll('.circle-menu-item');
        menuItems.forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                
                const category = this.getAttribute('data-cat');
                portalContainer.style.display = 'none';
                hintText.style.display = 'none';
                subTitle.style.display = 'none';
                contentContainer.style.display = 'block';

                let htmlData = '';

                if (category === 'story') {
                    htmlData = `
                        <h2 class="category-header-title">গল্প-উপন্যাস</h2>
                        <div class="post-card">
                            <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80" class="post-img" alt="ছবি">
                            <h2 class="post-title">১৩২ নম্বর এপিটাফ (২য় পর্ব)</h2>
                            <div class="post-content">ঘটনা-সংক্ষেপ: মিরা জানালার পাশে দাঁড়িয়ে বাচ্চাদের খেলা দেখতে থাকে, কিন্তু হঠাৎ খেয়াল করে তার ছেলে কেরেমে সেখানে নেই। খেলার ফাঁকে...</div>
                            <div class="post-footer">
                                <div class="post-tags">গল্প-উপন্যাস, ধারাবাহিক, রহস্য</div>
                                <div class="post-date">January 31, 2026</div>
                            </div>
                        </div>`;
                } else if (category === 'atheism') {
                    htmlData = `
                        <h2 class="category-header-title">নাস্তিকতার জবাব</h2>
                        <div class="post-card">
                            <img src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=600&q=80" class="post-img" alt="ছবি">
                            <h2 class="post-title">যেই প্রশ্নটি আমাকে ভাবিয়েছে</h2>
                            <div class="post-content"><strong>১</strong>
প্রশ্ন তো অনেকেই করে কিন্তু নাস্তিকদের মত প্রশ্ন খুব কমই করে। আমি যে প্রশ্নের কথা বলছি সেটা আমাকে করা হয়েছিল ২০২১ সালে। জীবনে অনেক প্রশ্নের উত্তর দিতে পারিনি, সেই প্রশ্নগুলো কি ছিল সেটাও মনে নেই। কিন্তু এই প্রশ্ন গত দুবছর আমাকে ভাবিয়েছে। কাউকে প্রশ্ন করার কথা আসলেই আমার মনে আসে সেই প্রশ্নের কথা। কাউকে জিজ্ঞেস করলেও পাইনি কোন সন্তোষজন উত্তর। ভাবছেন কি সেই এমন প্রশ্ন। তাহলে শুনুন বলছি...

প্রশ্ন করার আগে সেই ব্যক্তি একটি ঘটনা সম্পর্কে আমার মতামত জানতে চাই। সে বলে, একজন শিক্ষক ক্লাসের সব ছাত্রকে একটি প্রশ্ন করল কিন্তু সেই প্রশ্নের উত্তর কেউ দিতে পারল না একজন ছাত্র ছাড়া। সে উত্তর দিতে পেরেছিল কারণ প্রশ্ন করার আগেই শিক্ষক সেই ছাত্রটিকে প্রশ্নের উত্তর শিখিয়ে দেয়।

এই গল্প বলে সে আমাকে জিজ্ঞেস করে, এখানে শিক্ষক কি ছাত্রদের প্রতি জুলুম করল না !?

আমি সরল মনে উত্তর দিলাম, যদি শিক্ষক আগেই তাকে উত্তর বলে দেয় এবং ক্লাসে তার মান বৃদ্ধির জন্য এ কাজ করে থাকে তাহলে তো তিনি অবশ্যই বাকি ছাত্রদের প্রতি জুলুম করেছেন।

আমার এই উত্তর শুনে সে বলল, তুমি যেটাকে জুলুম বলছো না, এই জুলুম ফেরেশতাদের ওপরও করা হয়েছে। সে বলতে থাকলো সুরা বাকারার ৩১ নম্বর আয়াতের কথা যেখানে বলা হচ্ছে:

<em>"অতঃপর আদমকে সব জিনিসের নাম শিখিয়ে দিলেন পরে তিনি সেগুলো ফেরেশতাদের কাছে পেশ করে বললেন তোমরা যদি সত্যবাদী হও তাহলে তোমরা আমাকে এ নামগুলো বলতো?"</em>

অত্র আয়াতে আমরা দেখতে পাচ্ছি, আল্লাহ তায়ালা আদমকে সব জিনিসের নাম শিখিয়ে দিলেন অতঃপর ফেরেশতাদের প্রশ্ন করলেন ফেরেশতারা কোন উত্তর দিতে পারল না। বরং আদম তার উত্তর দিয়ে দিল।

এটা কি ফেরেশতাদের প্রতি জুলুম করা হলো না! ঐ শিক্ষক যেভাবে ছাত্রদের উপর জুলুম করলো ঠিক তেমনি আল্লাহ কি ফেরেশতাদের প্রতি জুলুম করল না!?

<strong>২</strong>
আজ দুই বছর পর গতকাল রাতে ঘুম কম হওয়ায় ক্লাসে ঝিমাচ্ছি। শত চেষ্টা করেও চোখের পাতা ধরে রাখতে পারছি না। ঘুমে আমার চোখ বন্ধ হয়ে আসছে। ঠিক তখনই মনে পড়ে গেল সেই প্রশ্নটির কথা।

এখন আর ঘুম নেই, চোখেমুখে হতাশার ছাপ। শয়তান ক্রমাগত ওয়াসওয়াসা দিয়ে যাচ্ছে। তাহলে কি আল্লাহ সত্যি ফেরেশতাদের প্রতি অবিচার করেছেন! নাহ এটা কিভাবে সম্ভব। আল্লাহ কারো প্রতি অন্যায় অবিচার করতে পারেন না। বরং তিনি কখনোই করবেন না। তাহলে এটা কি ছিল? এর উত্তরই বা কি হবে?

হাজারো চিন্তা আমার মাথায় দোল খাচ্ছে কিন্তু কোনক্রমে হিসাব মিলাতে পারছি না। তাহলে কি নাস্তিকদের যুক্তির কাছে আমাকে হার মানতে হবে? সারা জীবন কি এই প্রশ্ন আমাকে অস্থির করে রাখবে?

<strong>৩</strong>
সব চিন্তা বাদ দিয়ে আবারও প্রশ্নের উত্তর মেলাতে শুরু করলাম। কিছুক্ষণের মধ্যে এ বিষয়টা আমার কাছে স্পষ্ট হলো। আসলে প্রশ্নকারী নিজেও জানত এটা সৃষ্টি এবং স্রষ্টা নিয়ে প্রশ্ন কিন্তু সে আমাদের চিন্তাধারাকে কনভার্ট করার জন্য ছাত্র শিক্ষকের উদাহরণ দিয়েছে। ফলত যখনই প্রশ্নটা আমাদের করা হয় আমরা সেখানে আল্লাহকে শিক্ষক এবং আদমকে ছাত্রের স্থানে রেখে চিন্তা করা শুরু করি। তাই কোনভাবেই আমরা এর উত্তর মেলাতে পারি না।

মূলত ছাত্র শিক্ষকের গল্প বলে আমাদের ভুলিয়ে দেওয়া হয় আল্লাহ তাআলা আমাদের স্রষ্টা। তাই আমি যখন আল্লাহকে একজন স্রষ্টা এবং আদমকে সৃষ্টির জায়গায় রেখে চিন্তা করলাম। তখনই এর উত্তরটা আমার কাছে স্পষ্ট হলো এবং আমি একটি যুক্তি দাড় করলাম।

<strong>৪</strong>
প্রশ্নকারী কে তার মতই একটা প্রশ্ন করে তার মতামত জানতে চাইলাম। আমি বললাম, মনে কর তুমি একজন সাইন্সের ছাত্র। সাইন্সের ছাত্র হওয়ার ফলে তোমার মাথায় চিন্তা আসলো, কেমন হয় যদি আমি একটা রোবট বানাই। এটা ভেবে তুমি তোমার উদ্বেগের কথা তোমার ফ্রেন্ড সার্কেলের মাঝে শেয়ার করলে। কিন্তু তোমার রোবট বানানোর কথা শুনে তারা তোমাকে নিয়ে হাসি তামাশা করলো। এবং কেউ বলল, এই রোবোট দিয়ে কি করবি? হুদাই রোবট বানিয়ে কি হবে? রোবট কি আর করতে পারবে?

তুমি তাদের সব কথা কে উপেক্ষা করে ফিরে আসলে এবং কঠোর পরিশ্রম এর মাধ্যমে একটি রোবট তৈরি করলে। প্রগ্ৰামিং করে তুমি তার মাঝে এমন কিছু তথ্য দিলে যা অধিকাংশ মানুষ জানে না।

সব কাজ সম্পন্ন হওয়ার পর তুমি তোমার বুন্ধুদের হাসি তামাশার জবাব দিতে তোমার রোবট কে নিয়ে তোমার বন্ধুদের সামনে হাজির হলে। এবং তাদের কিছু প্রশ্ন করলে জ্ঞানের স্বল্পতার কারণে তার কোন উত্তর দিতে পারলো না।
ঠিক সেই একই প্রশ্ন গুলো তুমি তোমার প্রোগামিং করা রোবট কে জিজ্ঞেস করলে সে সব প্রশ্নের যথাযথ উত্তর দিয়ে দিলো। তুমি বন্ধুদের উদ্দেশ্য করে বললে, দেখ বন্ধু রোবট কি করতে পারে। তারা তাদের ভুল বুঝতে পারলো, তোমার সাফল্যে তারাও আনন্দিত হলো।

<strong>৫</strong>
এখন যদি আমি বলি, তুমি তোমার বন্ধুদের প্রতি জুলুম করলে। তাহলে নিশ্চয়ই তুমি বলবে, তুমি কোন অন্যায় করোনি। ঠিক তাই, তুমি যেমন তোমার রোবটকে প্রোগ্রামিং করেছ এই সকল প্রশ্নের উত্তর সহকারে। এটা যেমন তোমার রোবট বানানোরই অংশ। ঠিক তেমনি আল্লাহ তা'আলা আদমকে নাম শিক্ষা দিয়েছেন এটাও আদমকে সৃষ্টি করার অংশই ছিল। তাই অবশ্যই স্রষ্ঠার ইচ্ছাধিকার রয়েছে তিনি যাকে যেভাবে ইচ্ছা সৃষ্টি করতে পারেন।

তাছাড়া একজন শিক্ষক কখনোই ছাত্রদের প্রতি জুলুম করতে পারেন না যদি এমন ঘটনা ঘটে থাকে তাহলে অবশ্যই তার মাঝে হিকমা রয়েছে যেটা তিনিই ভালো জানেন। তাই যদি শিক্ষক এর দিক থেকেও চিন্তা করি, অবশ্যই তার মাঝে কোন না কোন হিকমত রয়েছে। কেননা আল্লাহ তা'আলা বলেন:
