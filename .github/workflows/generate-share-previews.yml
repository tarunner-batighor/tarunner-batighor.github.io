name: Refresh social share previews

on:
  # Published Firestore posts are mirrored to static crawler-readable pages once an hour.
  # Use Actions > Refresh social share previews > Run workflow for an immediate refresh.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-share-previews
  cancel-in-progress: false

jobs:
  build-share-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Generate published-post cards and Open Graph pages
        run: python scripts/generate-share-pages.py

      - name: Save changed share previews
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- share share-cards scripts/.share-manifest.json)" ]]; then
            echo "No social-preview changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- share share-cards scripts/.share-manifest.json
          git commit -m "chore: refresh social share previews"
          git push
